name: Publish Package

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: wavecalendar

      - name: Checkout WaveKit
        uses: actions/checkout@v4
        with:
          repository: codewavebr/wavekit
          path: wavekit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install and build WaveKit
        working-directory: wavekit
        run: |
          bun install
          bun run build

      - name: Install WaveCalendar
        working-directory: wavecalendar
        run: |
          bun install
          bun run link:wavekit

      - name: Test
        working-directory: wavecalendar
        run: bun run test

      - name: Typecheck
        working-directory: wavecalendar
        run: bun run typecheck

      - name: Build
        working-directory: wavecalendar
        run: bun run build

      - name: Configure GitHub Packages registry
        working-directory: wavecalendar
        run: echo "@codewave:registry=https://npm.pkg.github.com" > .npmrc

      - name: Publish to GitHub Packages
        working-directory: wavecalendar
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
