name: Publish Package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout WaveKit
        uses: actions/checkout@v5
        with:
          repository: codewavebr/wavekit
          path: wavekit

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install and build WaveKit
        working-directory: wavekit
        run: |
          bun install
          bun run build

      - name: Install WaveCalendar
        run: |
          bun install
          bun run link:wavekit

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Sync version from release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Configure GitHub Packages auth
        run: |
          echo "@codewave:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
